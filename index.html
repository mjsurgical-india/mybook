<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free 3D Flipbook</title>

    <!-- Visual Stylesheets for the 3D Engine -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #flipbook-container {
            width: 95%;
            height: 90vh;
            max-width: 1200px;
            box-shadow: 0px 10px 40px rgba(0,0,0,0.6);
            background: #222;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- The Flipbook Container pointing to your uploaded PDF -->
    <div id="flipbook-container" class="_df_book" source="document.pdf"></div>

    <!-- Core Scripts that animate the book -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

</body>
</html>
