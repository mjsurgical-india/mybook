<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Surgical - Premium 3D Page Flipbook</title>

    <!-- Page-Flip 3D Engine Stylesheet -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- PDF.js to render PDF pages crisply onto canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --outer-bg: #ffffff;     /* Default: White outer background */
            --inner-bg: #5ca595;     /* Default: Green inner stage background */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--outer-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        /* Top Theme Control Panel */
        #control-panel {
            position: absolute;
            top: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-panel-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-theme {
            background: #ffffff;
            color: #222;
            border: none;
            padding: 5px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            transform: scale(1.05);
            background: #e0e0e0;
        }

        /* Perfectly Centered Stage Box with Fixed Uniform Margins */
        #flipbook-stage {
            width: 90vw;
            height: 82vh;
            max-width: 1350px;
            max-height: 820px;
            box-shadow: 0px 25px 60px rgba(0,0,0,0.35);
            background-color: var(--inner-bg);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* The Interactive Canvas Flipbook Container */
        #book-container {
            display: none; /* Shown after PDF renders */
            margin: auto;
        }

        /* On-Screen Navigation Arrow Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .nav-btn:hover {
            background: rgba(92, 165, 149, 0.9);
            transform: translateY(-50%) scale(1.1);
        }

        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        /* Custom Styled #5ca595 Loading Screen */
        #loading-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <div class="control-group">
            <span>Outer Background:</span>
            <button class="btn-theme" onclick="setOuterBg('#ffffff')">White Mode</button>
            <button class="btn-theme" onclick="setOuterBg('#5ca595')">MJ Surgical</button>
            <button class="btn-theme" onclick="setOuterBg('#1a1a1a')">Dark Mode</button>
        </div>

        <div class="control-panel-divider"></div>

        <div class="control-group">
            <span>Inner Stage:</span>
            <button class="btn-theme" onclick="setInnerBg('#5ca595')">MJ Surgical</button>
            <button class="btn-theme" onclick="setInnerBg('#ffffff')">White Stage</button>
            <button class="btn-theme" onclick="setInnerBg('#2b2b2b')">Dark Stage</button>
        </div>
    </div>

    <!-- Main Stage maintaining uniform boundaries -->
    <div id="flipbook-stage">
        <!-- On-Screen Navigation Icons -->
        <button id="prev-btn" class="nav-btn" title="Previous Page">&#10094;</button>
        <button id="next-btn" class="nav-btn" title="Next Page">&#10095;</button>

        <!-- Custom Loading Spinner -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <span>LOADING MJ SURGICAL CATALOG...</span>
        </div>

        <!-- Canvas Flipbook Element -->
        <div id="book-container"></div>
    </div>

    <script>
        // Theme Switcher Functions
        function setOuterBg(color) {
            document.documentElement.style.setProperty('--outer-bg', color);
        }

        function setInnerBg(color) {
            document.documentElement.style.setProperty('--inner-bg', color);
        }

        let globalPageFlip = null;

        // Initialize PDF rendering and Physics Page-Flip with Hard Covers & Smooth Inner Pages
        async function loadPDFBook() {
            const url = 'document.pdf'; 
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                const bookContainer = document.getElementById('book-container');
                
                const firstPage = await pdfDoc.getPage(1);
                const initialViewport = firstPage.getViewport({ scale: 1.5 });
                const pdfWidth = initialViewport.width;
                const pdfHeight = initialViewport.height;

                for (let i = 1; i <= numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); 
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    canvas.className = 'page-canvas';

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    bookContainer.appendChild(canvas);
                }

                document.getElementById('loading-screen').style.display = 'none';
                bookContainer.style.display = 'block';

                // Initialize Page-Flip engine
                globalPageFlip = new St.PageFlip(bookContainer, {
                    width: pdfWidth,
                    height: pdfHeight,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 800,
                    minHeight: 400,
                    maxHeight: 1100,
                    maxShadowOpacity: 0.5,
                    showCover: true,             // Enables hardcover rigid styling for front & back covers
                    mobileScrollSupport: false,
                    useMouse: true,              // Mouse-drag corner peel
                    flippingTime: 900
                });

                globalPageFlip.loadFromHTML(document.querySelectorAll('.page-canvas'));

                // Connect On-Screen Arrow Buttons
                document.getElementById('next-btn').addEventListener('click', () => {
                    globalPageFlip.flipNext();
                });

                document.getElementById('prev-btn').addEventListener('click', () => {
                    globalPageFlip.flipPrev();
                });

                // Connect Keyboard Arrow Keys Support (Left/Right arrows)
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') {
                        globalPageFlip.flipNext();
                    } else if (e.key === 'ArrowLeft') {
                        globalPageFlip.flipPrev();
                    }
                });

            } catch (error) {
                console.error("Error loading PDF: ", error);
                document.getElementById('loading-screen').innerHTML = "<span style='color:#ff6b6b;'>Failed to load PDF. Check file name.</span>";
            }
        }

        window.addEventListener('DOMContentLoaded', loadPDFBook);
    </script>
</body>
</html>
