<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Surgical - Premium 3D Page Flipbook</title>

    <!-- Page-Flip 3D Engine -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- PDF.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --outer-bg: #ffffff;    /* Default Outer Background */
            --inner-bg: #5ca595;    /* Default MJ Surgical Green Inner Stage */
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--outer-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease;
        }

        /* Top Control Bar */
        #control-panel {
            position: absolute;
            top: 15px;
            background: rgba(18, 28, 32, 0.88);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-panel-divider {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-theme {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            transform: translateY(-1px);
            background: #5ca595;
            color: #ffffff;
            border-color: #5ca595;
            box-shadow: 0 4px 10px rgba(92, 165, 149, 0.4);
        }

        .btn-theme.active {
            background: #ffffff;
            color: #121c20;
            border-color: #ffffff;
        }

        /* Page Counter Indicator */
        #page-counter {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        /* Centered Stage */
        #flipbook-stage {
            width: 90vw;
            height: 82vh;
            max-width: 1350px;
            max-height: 820px;
            box-shadow: 0px 25px 60px rgba(0,0,0,0.35);
            background-color: var(--inner-bg);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.3s ease;
            padding: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Flipbook Wrapper */
        #book-container {
            display: none;
            margin: auto;
        }

        /* Navigation Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(18, 28, 32, 0.65);
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn:hover {
            background: #5ca595;
            border-color: #5ca595;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 6px 20px rgba(92, 165, 149, 0.5);
        }

        #prev-btn { left: 25px; }
        #next-btn { right: 25px; }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Fallback HTML Canvas Pages Styling */
        .page-canvas {
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .demo-page {
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 30px;
            box-sizing: border-box;
            border: 1px solid #e0e0e0;
        }

        .demo-cover {
            background: linear-gradient(135deg, #121c20 0%, #2b3d44 100%);
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .demo-cover h1 {
            font-size: 32px;
            color: #5ca595;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .demo-cover p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .demo-header {
            font-size: 18px;
            font-weight: bold;
            color: #5ca595;
            border-bottom: 2px solid #5ca595;
            padding-bottom: 8px;
        }

        .demo-body {
            font-size: 13px;
            color: #444;
            line-height: 1.6;
        }

        .demo-footer {
            font-size: 11px;
            color: #888;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <div class="control-group">
            <span>Outer Background:</span>
            <button class="btn-theme" onclick="setOuterBg('#ffffff')">White</button>
            <button class="btn-theme" onclick="setOuterBg('#5ca595')">MJ Teal</button>
            <button class="btn-theme" onclick="setOuterBg('#121c20')">Dark</button>
        </div>

        <div class="control-panel-divider"></div>

        <div class="control-group">
            <span>Inner Stage:</span>
            <button class="btn-theme" onclick="setInnerBg('#5ca595')">MJ Teal</button>
            <button class="btn-theme" onclick="setInnerBg('#ffffff')">White</button>
            <button class="btn-theme" onclick="setInnerBg('#1e2a2f')">Dark</button>
        </div>

        <div class="control-panel-divider"></div>

        <div id="page-counter">Page 1</div>

        <button class="btn-theme" onclick="toggleFullscreen()" style="margin-left: 5px;">⛶ Fullscreen</button>
    </div>

    <!-- Main Stage Container -->
    <div id="flipbook-stage">
        <!-- On-Screen Navigation Arrows -->
        <button id="prev-btn" class="nav-btn" title="Previous Page">&#10094;</button>
        <button id="next-btn" class="nav-btn" title="Next Page">&#10095;</button>

        <!-- Loading Screen Indicator -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <span id="loading-text">LOADING BROCHURE...</span>
        </div>

        <!-- Interactive Canvas Flipbook Container -->
        <div id="book-container"></div>
    </div>

    <script>
        // Set Theme Background Colors
        function setOuterBg(color) {
            document.documentElement.style.setProperty('--outer-bg', color);
        }

        function setInnerBg(color) {
            document.documentElement.style.setProperty('--inner-bg', color);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        let globalPageFlip = null;

        // Initialize PDF rendering with 3D Page-Flip Engine
        async function loadPDFBook() {
            const url = 'document.pdf'; 
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            const bookContainer = document.getElementById('book-container');
            bookContainer.innerHTML = '';

            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                const firstPage = await pdfDoc.getPage(1);
                const initialViewport = firstPage.getViewport({ scale: 1.5 });
                const pdfWidth = initialViewport.width;
                const pdfHeight = initialViewport.height;

                for (let i = 1; i <= numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); 
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    canvas.className = 'page-canvas';

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    bookContainer.appendChild(canvas);
                }

                initPageFlip(pdfWidth, pdfHeight);

            } catch (error) {
                console.warn("document.pdf not found or failed to load. Rendering Sample Brochure...", error);
                renderSampleBrochure();
            }
        }

        // Sample Brochure Render (Used if document.pdf is missing during preview)
        function renderSampleBrochure() {
            const bookContainer = document.getElementById('book-container');
            bookContainer.innerHTML = `
                <div class="demo-page demo-cover">
                    <h1>MJ SURGICAL</h1>
                    <p>PRECISION SURGICAL INSTRUMENTS</p>
                    <div style="margin-top: 30px; font-size: 12px; border: 1px solid #5ca595; padding: 6px 16px; border-radius: 20px;">
                        PRODUCT CATALOG 2026
                    </div>
                </div>

                <div class="demo-page">
                    <div class="demo-header">ABOUT MJ SURGICAL</div>
                    <div class="demo-body">
                        <p>MJ Surgical is a global pioneer in manufacturing top-grade surgical instruments, orthopedic implants, and laparoscopic tools.</p>
                        <p>Our commitment to ergonomic engineering and medical precision ensures that surgeons across the globe perform with utmost confidence and safety.</p>
                    </div>
                    <div class="demo-footer">Page 2 — MJ Surgical Catalog</div>
                </div>

                <div class="demo-page">
                    <div class="demo-header">ORTHOPEDIC IMPLANTS</div>
                    <div class="demo-body">
                        <ul>
                            <li><strong>Titanium Trauma Plates:</strong> Anatomically contoured for optimal bone fixation.</li>
                            <li><strong>Intramedullary Nails:</strong> Precision crafted for rapid healing and minimal incision.</li>
                            <li><strong>Cannulated Screws:</strong> High mechanical stability for fracture repair.</li>
                        </ul>
                    </div>
                    <div class="demo-footer">Page 3 — MJ Surgical Catalog</div>
                </div>

                <div class="demo-page">
                    <div class="demo-header">LAPAROSCOPIC INSTRUMENTS</div>
                    <div class="demo-body">
                        <ul>
                            <li><strong>5mm Graspers:</strong> High-precision tactile feedback and rotating shafts.</li>
                            <li><strong>Monopolar Scissors:</strong> Ultra-sharp edge retention for clean tissue dissection.</li>
                            <li><strong>Trocar Systems:</strong> Ergonomic seal designs for smooth instrument insertion.</li>
                        </ul>
                    </div>
                    <div class="demo-footer">Page 4 — MJ Surgical Catalog</div>
                </div>

                <div class="demo-page demo-cover">
                    <h1>CONTACT US</h1>
                    <p>info@mjsurgical.com</p>
                    <p>www.mjsurgical.com</p>
                    <p style="margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.5);">© 2026 MJ Surgical. All rights reserved.</p>
                </div>
            `;

            initPageFlip(550, 730);
        }

        // Initialize 3D Physics Engine
        function initPageFlip(width, height) {
            document.getElementById('loading-screen').style.display = 'none';
            const bookContainer = document.getElementById('book-container');
            bookContainer.style.display = 'block';

            globalPageFlip = new St.PageFlip(bookContainer, {
                width: width,
                height: height,
                size: "stretch",
                minWidth: 300,
                maxWidth: 800,
                minHeight: 400,
                maxHeight: 1100,
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: false,
                useMouse: true,
                flippingTime: 800
            });

            const pages = bookContainer.children;
            globalPageFlip.loadFromHTML(pages);

            // Update Page Counter Text
            const updateCounter = () => {
                const current = globalPageFlip.getCurrentPageIndex() + 1;
                const total = globalPageFlip.getPageCount();
                document.getElementById('page-counter').innerText = `Page ${current} of ${total}`;
            };

            globalPageFlip.on('flip', updateCounter);
            updateCounter();

            // Connect Arrow Buttons
            document.getElementById('next-btn').onclick = () => globalPageFlip.flipNext();
            document.getElementById('prev-btn').onclick = () => globalPageFlip.flipPrev();

            // Keyboard Left/Right Arrow Navigation
            document.onkeydown = (e) => {
                if (e.key === 'ArrowRight') globalPageFlip.flipNext();
                if (e.key === 'ArrowLeft') globalPageFlip.flipPrev();
            };
        }

        window.addEventListener('DOMContentLoaded', loadPDFBook);
    </script>
</body>
</html>
