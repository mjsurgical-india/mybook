<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Surgical - Premium 3D Flipbook</title>

    <!-- DearFlip 3D Viewer Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">

    <style>
        :root {
            --outer-bg: #ffffff;     /* Default: White outer background */
            --inner-bg: #5ca595;     /* Default: Green inner stage background */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--outer-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        /* Top Theme Control Panel */
        #control-panel {
            position: absolute;
            top: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-panel-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-theme {
            background: #ffffff;
            color: #222;
            border: none;
            padding: 5px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            transform: scale(1.05);
            background: #e0e0e0;
        }

        /* Inner Stage Box Behind Book */
        #flipbook-container {
            width: 92%;
            height: 85vh;
            max-width: 1300px;
            box-shadow: 0px 20px 60px rgba(0,0,0,0.4);
            background-color: var(--inner-bg) !important;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        /* Custom Styled #5ca595 Loading Spinner/Animation */
        ._df_loader, .df-loader {
            border: 4px solid rgba(92, 165, 149, 0.2) !important;
            border-top: 4px solid #5ca595 !important;
            border-radius: 50% !important;
            width: 50px !important;
            height: 50px !important;
            animation: spin 1s linear infinite !important;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <div class="control-group">
            <span>Outer Background:</span>
            <button class="btn-theme" onclick="setOuterBg('#ffffff')">White Mode</button>
            <button class="btn-theme" onclick="setOuterBg('#5ca595')">MJ Surgical</button>
            <button class="btn-theme" onclick="setOuterBg('#1a1a1a')">Dark Mode</button>
        </div>

        <div class="control-panel-divider"></div>

        <div class="control-group">
            <span>Inner Stage:</span>
            <button class="btn-theme" onclick="setInnerBg('#5ca595')">MJ Surgical</button>
            <button class="btn-theme" onclick="setInnerBg('#ffffff')">White Stage</button>
            <button class="btn-theme" onclick="setInnerBg('#2b2b2b')">Dark Stage</button>
        </div>
    </div>

    <!-- 
      Flipbook Container with Strict 3D WebGL Corner-Dragging Physics
    -->
    <div id="flipbook-container" class="_df_book" source="document.pdf" 
         settings='{
             "webgl": true,
             "pageTextureSize": 2048,
             "soundEnable": true,
             "duration": 1200,
             "autoEnableOutline": false,
             "autoEnableThumbnail": true,
             "overwritePDFConfig": true
         }'>
    </div>

    <!-- Core Engine Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>

    <script>
        // Functions to change backgrounds dynamically via buttons
        function setOuterBg(color) {
            document.documentElement.style.setProperty('--outer-bg', color);
        }

        function setInnerBg(color) {
            document.documentElement.style.setProperty('--inner-bg', color);
        }
    </script>
</body>
</html>
