<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Surgical Catalog - 3D Flipbook</title>

    <!-- DearFlip 3D Viewer Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #flipbook-container {
            width: 90%;
            height: 85vh;
            max-width: 1200px;
            box-shadow: 0px 10px 40px rgba(0,0,0,0.6);
            background: #222;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- The Flipbook Container pointing directly to your PDF file in the same folder -->
    <div id="flipbook-container" class="_df_book" source="document.pdf"></div>

    <!-- Working Engine Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>

</body>
</html>
