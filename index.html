
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ Surgical - Soft Page Flip Brochure</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --outer-bg: #ffffff;
      --inner-bg: #5ca595;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 82px 16px 16px;
      background: var(--outer-bg);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color .25s ease;
    }

    #control-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px 16px;
      max-width: calc(100vw - 24px);
      padding: 9px 14px;
      color: #fff;
      background: rgba(0,0,0,.78);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.25);
      font-size: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .control-panel-divider {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,.35);
    }

    .btn-theme {
      border: 0;
      border-radius: 12px;
      padding: 6px 9px;
      background: #fff;
      color: #222;
      cursor: pointer;
      font-size: 11px;
    }

    .btn-theme:hover { background: #e7e7e7; }

    #flipbook-stage {
      width: min(94vw, 1200px);
      height: min(82vh, 850px);
      min-height: 360px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 24px 58px;
      border-radius: 12px;
      background: var(--inner-bg);
      box-shadow: 0 20px 55px rgba(0,0,0,.28);
      transition: background-color .25s ease;
    }

    #book-container {
      display: none;
      margin: auto;
      background: transparent;
    }

    #book-container .page {
      background: #fff;
      overflow: hidden;
    }

    #book-container .page canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(0,0,0,.62);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,.22);
    }

    .nav-btn:hover { background: rgba(30,30,30,.9); }

    #prev-btn { left: 10px; }
    #next-btn { right: 10px; }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      body { padding: 105px 8px 8px; }

      #control-panel {
        gap: 8px;
        border-radius: 12px;
      }

      .control-panel-divider { display: none; }

      #flipbook-stage {
        width: 96vw;
        height: 78vh;
        min-height: 320px;
        padding: 16px 42px;
      }

      .nav-btn {
        width: 34px;
        height: 34px;
        font-size: 17px;
      }

      #prev-btn { left: 4px; }
      #next-btn { right: 4px; }
    }
  </style>
</head>

<body>
  <div id="control-panel">
    <div class="control-group">
      <span>Outer Background:</span>
      <button class="btn-theme" onclick="setOuterBg('#ffffff')">White</button>
      <button class="btn-theme" onclick="setOuterBg('#5ca595')">MJ Surgical</button>
      <button class="btn-theme" onclick="setOuterBg('#1a1a1a')">Dark</button>
    </div>

    <div class="control-panel-divider"></div>

    <div class="control-group">
      <span>Inner Stage:</span>
      <button class="btn-theme" onclick="setInnerBg('#5ca595')">MJ Surgical</button>
      <button class="btn-theme" onclick="setInnerBg('#ffffff')">White</button>
      <button class="btn-theme" onclick="setInnerBg('#2b2b2b')">Dark</button>
    </div>
  </div>

  <main id="flipbook-stage">
    <button id="prev-btn" class="nav-btn"
      title="Previous page" aria-label="Previous page">&#10094;</button>

    <button id="next-btn" class="nav-btn"
      title="Next page" aria-label="Next page">&#10095;</button>

    <div id="loading-screen">
      <div class="spinner"></div>
      <span>LOADING MJ SURGICAL CATALOG...</span>
    </div>

    <div id="book-container"></div>
  </main>

  <script>
    function setOuterBg(color) {
      document.documentElement.style.setProperty('--outer-bg', color);
    }

    function setInnerBg(color) {
      document.documentElement.style.setProperty('--inner-bg', color);
    }

    let globalPageFlip = null;

    async function loadPDFBook() {
      const pdfUrl = 'document.pdf';

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

      const loadingScreen = document.getElementById('loading-screen');
      const bookContainer = document.getElementById('book-container');

      try {
        const pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        const firstPdfPage = await pdfDoc.getPage(1);
        const baseViewport = firstPdfPage.getViewport({ scale: 1 });

        const pageWidth = baseViewport.width;
        const pageHeight = baseViewport.height;

        for (let pageNumber = 1;
             pageNumber <= pdfDoc.numPages;
             pageNumber++) {

          const pdfPage = await pdfDoc.getPage(pageNumber);
          const viewport = pdfPage.getViewport({ scale: 1.6 });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d', { alpha: false });

          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          canvas.className = 'page-canvas';

          await pdfPage.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          // Every PDF page becomes a regular, soft page.
          const sheet = document.createElement('div');
          sheet.className = 'page';
          sheet.appendChild(canvas);
          bookContainer.appendChild(sheet);
        }

        loadingScreen.style.display = 'none';
        bookContainer.style.display = 'block';

        globalPageFlip = new St.PageFlip(bookContainer, {
          width: pageWidth,
          height: pageHeight,
          size: 'stretch',

          minWidth: 250,
          maxWidth: 900,
          minHeight: 350,
          maxHeight: 1200,

          autoSize: true,
          maxShadowOpacity: 0.35,

          showCover: false,
          usePortrait: true,
          startPage: 0,

          mobileScrollSupport: false,
          useMouse: true,
          flippingTime: 900,
          drawShadow: true
        });

        globalPageFlip.loadFromHTML(
          bookContainer.querySelectorAll('.page')
        );

        document.getElementById('next-btn')
          .addEventListener('click', () => {
            globalPageFlip.flipNext();
          });

        document.getElementById('prev-btn')
          .addEventListener('click', () => {
            globalPageFlip.flipPrev();
          });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowRight') {
            globalPageFlip.flipNext();
          }

          if (event.key === 'ArrowLeft') {
            globalPageFlip.flipPrev();
          }
        });

        window.addEventListener('resize', () => {
          if (globalPageFlip) {
            globalPageFlip.update();
          }
        });

      } catch (error) {
        console.error('Error loading PDF:', error);

        loadingScreen.innerHTML =
          '<span style="color:#ffdddd">' +
          'Could not load document.pdf. Make sure the PDF is ' +
          'in the same folder and open this page through a local web server.' +
          '</span>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadPDFBook);
  </script>
</body>
</html>
