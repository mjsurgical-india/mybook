<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Surgical - Premium 3D Flipbook</title>

    <!-- DearFlip 3D Viewer Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            /* Updated background color to your hex code */
            background-color: #5ca595;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #flipbook-container {
            width: 92%;
            height: 88vh;
            max-width: 1300px;
            box-shadow: 0px 15px 50px rgba(0,0,0,0.4);
            background: #ffffff;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- 
      Upgraded Flipbook Container with Premium Settings:
      - 3D WebGL mode enabled for corner-dragging wave/fold motion
      - Higher resolution settings to fix blur
    -->
    <div id="flipbook-container" class="_df_book" source="document.pdf" 
         settings='{"webgl":true, "pageTextureSize": 2048, "soundEnable": true, "duration": 800, "autoEnableOutline": false, "autoEnableThumbnail": true}'>
    </div>

    <!-- Working Engine Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>

</body>
</html>
