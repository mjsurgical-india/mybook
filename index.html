
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ Surgical - Soft Page Flip Brochure</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --outer-bg: #ffffff;
      --inner-bg: #5ca595;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 76px 14px 14px;
      background: var(--outer-bg);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color .25s ease;
    }

    #control-panel {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 14px;
      max-width: calc(100vw - 20px);
      padding: 9px 13px;
      color: #fff;
      background: rgba(0, 0, 0, .78);
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .25);
      font-size: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .control-panel-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, .35);
    }

    .btn-theme {
      border: 0;
      border-radius: 12px;
      padding: 6px 9px;
      background: #fff;
      color: #222;
      cursor: pointer;
      font-size: 11px;
    }

    .btn-theme:hover {
      background: #e7e7e7;
    }

    #flipbook-stage {
      width: min(94vw, 1200px);
      height: min(82vh, 850px);
      min-height: 320px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px 56px;
      border-radius: 12px;
      background: var(--inner-bg);
      box-shadow: 0 20px 55px rgba(0, 0, 0, .28);
      transition: background-color .25s ease;
    }

    #book-container {
      display: none;
      margin: auto;
      background: transparent;
      flex: 0 0 auto;
    }

    #book-container .page {
      background: #fff;
      overflow: hidden;
    }

    #book-container .page canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(0, 0, 0, .62);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
    }

    .nav-btn:hover {
      background: rgba(30, 30, 30, .9);
    }

    #prev-btn {
      left: 10px;
    }

    #next-btn {
      right: 10px;
    }

    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 110px 6px 6px;
      }

      #control-panel {
        gap: 7px;
        border-radius: 12px;
      }

      .control-panel-divider {
        display: none;
      }

      #flipbook-stage {
        width: 96vw;
        height: 76vh;
        min-height: 300px;
        padding: 12px 40px;
      }

      .nav-btn {
        width: 34px;
        height: 34px;
        font-size: 17px;
      }

      #prev-btn {
        left: 4px;
      }

      #next-btn {
        right: 4px;
      }
    }
  </style>
</head>

<body>

  <!-- Background controls -->
  <div id="control-panel">

    <div class="control-group">
      <span>Outer Background:</span>
      <button class="btn-theme" onclick="setOuterBg('#ffffff')">White</button>
      <button class="btn-theme" onclick="setOuterBg('#5ca595')">MJ Surgical</button>
      <button class="btn-theme" onclick="setOuterBg('#1a1a1a')">Dark</button>
    </div>

    <div class="control-panel-divider"></div>

    <div class="control-group">
      <span>Inner Stage:</span>
      <button class="btn-theme" onclick="setInnerBg('#5ca595')">MJ Surgical</button>
      <button class="btn-theme" onclick="setInnerBg('#ffffff')">White</button>
      <button class="btn-theme" onclick="setInnerBg('#2b2b2b')">Dark</button>
    </div>

  </div>

  <!-- Brochure stage -->
  <main id="flipbook-stage">

    <button
      id="prev-btn"
      class="nav-btn"
      title="Previous page"
      aria-label="Previous page"
    >&#10094;</button>

    <button
      id="next-btn"
      class="nav-btn"
      title="Next page"
      aria-label="Next page"
    >&#10095;</button>

    <div id="loading-screen">
      <div class="spinner"></div>
      <span>LOADING MJ SURGICAL CATALOG...</span>
    </div>

    <div id="book-container"></div>

  </main>

  <script>
    function setOuterBg(color) {
      document.documentElement.style.setProperty(
        '--outer-bg',
        color
      );
    }

    function setInnerBg(color) {
      document.documentElement.style.setProperty(
        '--inner-bg',
        color
      );
    }

    let globalPageFlip = null;
    let resizeTimer = null;

    async function loadPDFBook() {
      const loadingScreen =
        document.getElementById('loading-screen');

      const bookContainer =
        document.getElementById('book-container');

      const stage =
        document.getElementById('flipbook-stage');

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

      try {
        const pdfDoc =
          await pdfjsLib.getDocument('document.pdf').promise;

        const firstPage = await pdfDoc.getPage(1);
        const baseViewport = firstPage.getViewport({ scale: 1 });

        const pageRatio =
          baseViewport.width / baseViewport.height;

        // Fit one portrait page inside the stage.
        function calculatePageSize() {
          const availableWidth =
            Math.max(240, stage.clientWidth - 112);

          const availableHeight =
            Math.max(300, stage.clientHeight - 40);

          const width = Math.min(
            availableWidth,
            availableHeight * pageRatio
          );

          return {
            width: Math.round(width),
            height: Math.round(width / pageRatio)
          };
        }

        // Render each PDF page as a normal soft page.
        for (
          let pageNumber = 1;
          pageNumber <= pdfDoc.numPages;
          pageNumber++
        ) {
          const pdfPage = await pdfDoc.getPage(pageNumber);

          const viewport =
            pdfPage.getViewport({ scale: 1.6 });

          const canvas = document.createElement('canvas');

          const context =
            canvas.getContext('2d', { alpha: false });

          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);

          canvas.className = 'page-canvas';

          await pdfPage.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          const sheet = document.createElement('div');
          sheet.className = 'page';
          sheet.appendChild(canvas);

          bookContainer.appendChild(sheet);
        }

        loadingScreen.style.display = 'none';
        bookContainer.style.display = 'block';

        function createFlipbook(startPage = 0) {
          const size = calculatePageSize();

          globalPageFlip = new St.PageFlip(
            bookContainer,
            {
              width: size.width,
              height: size.height,

              // Fixed single-page dimensions prevent a
              // wide desktop stage from forcing a spread.
              size: 'fixed',
              minWidth: size.width,
              maxWidth: size.width,
              minHeight: size.height,
              maxHeight: size.height,

              autoSize: false,
              maxShadowOpacity: 0.35,

              // No special hardcover treatment.
              showCover: false,

              // Start with one A4 portrait page.
              usePortrait: true,
              startPage: startPage,

              mobileScrollSupport: false,
              useMouse: true,
              flippingTime: 900,
              drawShadow: true
            }
          );

          globalPageFlip.loadFromHTML(
            bookContainer.querySelectorAll('.page')
          );

          if (startPage > 0) {
            globalPageFlip.turnToPage(startPage);
          }
        }

        createFlipbook(0);

        document
          .getElementById('next-btn')
          .addEventListener('click', () => {
            if (globalPageFlip) {
              globalPageFlip.flipNext();
            }
          });

        document
          .getElementById('prev-btn')
          .addEventListener('click', () => {
            if (globalPageFlip) {
              globalPageFlip.flipPrev();
            }
          });

        document.addEventListener('keydown', (event) => {
          if (!globalPageFlip) return;

          if (event.key === 'ArrowRight') {
            globalPageFlip.flipNext();
          }

          if (event.key === 'ArrowLeft') {
            globalPageFlip.flipPrev();
          }
        });

        // Recalculate page size when the viewport changes.
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);

          resizeTimer = setTimeout(() => {
            if (!globalPageFlip) return;

            const currentPage =
              globalPageFlip.getCurrentPageIndex();

            globalPageFlip.destroy();
            createFlipbook(currentPage);
          }, 200);
        });

      } catch (error) {
        console.error('Error loading PDF:', error);

        loadingScreen.innerHTML =
          '<span style="color:#ffdddd">' +
          'Could not load document.pdf. Make sure the PDF is ' +
          'in the same folder and open this page through a local web server.' +
          '</span>';
      }
    }

    window.addEventListener(
      'DOMContentLoaded',
      loadPDFBook
    );
  </script>

</body>
</html>
