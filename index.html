<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive 3D Flipbook</title>
    
    <!-- Reliable HTML5 Flipbook Stylesheet -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #book-container {
            width: 90%;
            height: 85vh;
            background: #222;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- The Window Container for the Book Layout -->
    <div id="book-container"></div>

    <!-- The Core Engine Processing Script -->
    <script src="https://jsdelivr.net"></script>
    
    <script>
        // Force the code to find the document file path relatively
        const bookOptions = {
            pdf: 'document.pdf'
        };

        // Render the script inside the HTML container
        FlipbookViewer.init(bookOptions, 'book-container', function(err, viewer) {
            if (err) {
                console.error("Error loading flipbook: ", err);
            } else {
                console.log("Flipbook loaded successfully!");
            }
        });
    </script>
</body>
</html>
