<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ Surgical - Premium 3D Page Flipbook</title>

    <!-- Page-Flip 3D Engine -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- PDF.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --outer-bg: #ffffff;     /* Default Outer Background */
            --inner-bg: #5ca595;     /* Default Teal Inner Stage */
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--outer-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        /* Top Theme Control Panel */
        #control-panel {
            position: absolute;
            top: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-panel-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-theme {
            background: #ffffff;
            color: #222;
            border: none;
            padding: 5px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            transform: scale(1.05);
            background: #e0e0e0;
        }

        /* Perfectly Centered Stage Box with Fixed Margins & Equal Padding */
        #flipbook-stage {
            width: 92vw;
            height: 80vh;
            max-width: 1300px;
            max-height: 800px;
            box-shadow: 0px 20px 50px rgba(0,0,0,0.3);
            background-color: var(--inner-bg);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.3s ease;
            padding: 35px 60px; /* Uniform margins so pages never touch borders */
            overflow: hidden;
        }

        /* Interactive Canvas Container */
        #book-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book-container {
            display: none;
            margin: auto;
        }

        /* Navigation Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #222;
            transform: translateY(-50%) scale(1.1);
        }

        #prev-btn { left: 15px; }
        #next-btn { right: 15px; }

        /* Custom Loading Screen */
        #loading-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .page-canvas {
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <div class="control-group">
            <span>Outer Background:</span>
            <button class="btn-theme" onclick="setOuterBg('#ffffff')">White Mode</button>
            <button class="btn-theme" onclick="setOuterBg('#5ca595')">Teal</button>
            <button class="btn-theme" onclick="setOuterBg('#1a1a1a')">Dark Mode</button>
        </div>

        <div class="control-panel-divider"></div>

        <div class="control-group">
            <span>Inner Stage:</span>
            <button class="btn-theme" onclick="setInnerBg('#5ca595')">Teal</button>
            <button class="btn-theme" onclick="setInnerBg('#ffffff')">White Stage</button>
            <button class="btn-theme" onclick="setInnerBg('#2b2b2b')">Dark Stage</button>
        </div>
    </div>

    <!-- Main Stage Box -->
    <div id="flipbook-stage">
        <button id="prev-btn" class="nav-btn" title="Previous Page">&#10094;</button>
        <button id="next-btn" class="nav-btn" title="Next Page">&#10095;</button>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <span id="loading-text">LOADING BROCHURE...</span>
        </div>

        <!-- Canvas Flipbook Wrapper -->
        <div id="book-wrapper">
            <div id="book-container"></div>
        </div>
    </div>

    <script>
        function setOuterBg(color) {
            document.documentElement.style.setProperty('--outer-bg', color);
        }

        function setInnerBg(color) {
            document.documentElement.style.setProperty('--inner-bg', color);
        }

        let globalPageFlip = null;

        async function loadPDFBook() {
            const loadingText = document.getElementById('loading-text');
            const url = './document.pdf'; 
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            try {
                loadingText.innerText = 'LOADING BROCHURE...';
                
                const loadingTask = pdfjsLib.getDocument({
                    url: url,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
                    cMapPacked: true,
                });

                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                const bookContainer = document.getElementById('book-container');
                
                // Read Page 1 for initial viewport dimensions
                const firstPage = await pdfDoc.getPage(1);
                const unscaledViewport = firstPage.getViewport({ scale: 1.0 });

                // Calculate stage height available for the book
                const stage = document.getElementById('flipbook-stage');
                const availHeight = stage.clientHeight - 70; // 35px top & bottom margin
                const availWidth = (stage.clientWidth - 120) / 2; // Split spread width across 2 pages

                // Calculate scale to fit inside stage perfectly
                const scale = Math.min(availHeight / unscaledViewport.height, availWidth / unscaledViewport.width);

                const renderViewport = firstPage.getViewport({ scale: scale * 1.5 }); // High-DPI crisp rendering
                const displayWidth = Math.round(unscaledViewport.width * scale);
                const displayHeight = Math.round(unscaledViewport.height * scale);

                for (let i = 1; i <= numPages; i++) {
                    loadingText.innerText = `PROCESSING PAGE ${i} OF ${numPages}...`;

                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: scale * 1.5 }); 
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    // Display dimensions locked to prevent cropping
                    canvas.style.width = displayWidth + 'px';
                    canvas.style.height = displayHeight + 'px';
                    canvas.className = 'page-canvas';

                    await page.render({ 
                        canvasContext: context, 
                        viewport: viewport 
                    }).promise;

                    bookContainer.appendChild(canvas);
                }

                document.getElementById('loading-screen').style.display = 'none';
                bookContainer.style.display = 'block';

                // Initialize 3D PageFlip with proportional bounds
                globalPageFlip = new St.PageFlip(bookContainer, {
                    width: displayWidth,
                    height: displayHeight,
                    size: "fixed",               // Fixed fit prevents clipping at stage boundaries
                    minWidth: 250,
                    maxWidth: 700,
                    minHeight: 350,
                    maxHeight: 1000,
                    maxShadowOpacity: 0.4,
                    showCover: true,             // Keeps single front/back cover centered
                    mobileScrollSupport: false,
                    useMouse: true,
                    flippingTime: 850
                });

                globalPageFlip.loadFromHTML(document.querySelectorAll('.page-canvas'));

                // Connect Arrow Buttons
                document.getElementById('next-btn').onclick = () => globalPageFlip.flipNext();
                document.getElementById('prev-btn').onclick = () => globalPageFlip.flipPrev();

                // Connect Keyboard Navigation
                document.onkeydown = (e) => {
                    if (e.key === 'ArrowRight') globalPageFlip.flipNext();
                    if (e.key === 'ArrowLeft') globalPageFlip.flipPrev();
                };

            } catch (error) {
                console.error("PDF Loading Error: ", error);
                document.getElementById('loading-screen').innerHTML = `
                    <div style="color:#ff6b6b; font-size:13px; line-height:1.6;">
                        <strong>FAILED TO LOAD BROCHURE</strong><br/>
                        ${error.message || 'Check document.pdf in repository root.'}
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadPDFBook);
    </script>
</body>
</html>
