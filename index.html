<script>
        // Theme Switcher Functions
        function setOuterBg(color) {
            document.documentElement.style.setProperty('--outer-bg', color);
        }

        function setInnerBg(color) {
            document.documentElement.style.setProperty('--inner-bg', color);
        }

        // Initialize PDF rendering and Physics Page-Flip with full-spread layout
        async function loadPDFBook() {
            const url = 'document.pdf'; 
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                const bookContainer = document.getElementById('book-container');
                
                // Read first page to calculate exact width and height proportions
                const firstPage = await pdfDoc.getPage(1);
                const initialViewport = firstPage.getViewport({ scale: 1.5 });
                const singlePageWidth = initialViewport.width;
                const singlePageHeight = initialViewport.height;

                // Generate high-resolution canvas elements for every page
                for (let i = 1; i <= numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); 
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    canvas.className = 'page-canvas';

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    bookContainer.appendChild(canvas);
                }

                // Hide loading screen and display the interactive book stage
                document.getElementById('loading-screen').style.display = 'none';
                bookContainer.style.display = 'block';

                // Initialize Page-Flip physics engine
                const pageFlip = new PageFlip(bookContainer, {
                    width: singlePageWidth,
                    height: singlePageHeight,
                    size: "fixed",
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1200,
                    maxShadowOpacity: 0.3,
                    showCover: true,         // Keeps the cover layout style
                    usePortrait: false,      // <-- CHANGE 1: Keeps layout stable across spreads
                    mobileScrollSupport: false,
                    useMouse: true,
                    flippingTime: 900
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page-canvas'));

                // <-- CHANGE 2: Force front/back covers to act as soft, flexible paper sheets
                pageFlip.getPageCollection().getPages().forEach((page) => {
                    page.setHard(false); 
                });

            } catch (error) {
                console.error("Error loading PDF: ", error);
                document.getElementById('loading-screen').innerHTML = "<span style='color:#ff6b6b;'>Failed to load PDF. Check file name.</span>";
            }
        }

        // Run builder on startup
        window.addEventListener('DOMContentLoaded', loadPDFBook);
    </script>
